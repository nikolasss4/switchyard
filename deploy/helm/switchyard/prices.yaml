# Model prices in USD per million tokens. Bump `version` on every change: each
# usage record stores the version it was priced with, so old costs stay
# explainable after a price change.
version: "2026-10-31"
models:
  # Anthropic first-party API list prices.
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01   # the standard 0.1x cache-read multiplier
    cache_write: 0.125 # the standard 1.25x 5-minute cache-write multiplier
    # Prompts over 100K input tokens are billed at a higher rate.
    long_context: {above_input_tokens: 100000, input: 0.50, output: 2.50}

  # Self-hosted models (mlx_lm.server, vLLM, Ollama) cost nothing per token.
  local/*: {input: 0, output: 0}

  # The mock provider. These are made-up prices so the demo shows cost
  # accounting and budgets working; they correspond to no real model.
  mock-fast:  {input: 0.50, output: 1.50}
  mock-smart: {input: 3.00, output: 15.00}
