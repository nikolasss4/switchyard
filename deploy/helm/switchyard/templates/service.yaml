apiVersion: v1
kind: Service
metadata:
  name: {{ include "switchyard.name" . }}
  labels: {{- include "switchyard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "switchyard.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
---
# The admin API and metrics stay cluster-internal.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "switchyard.name" . }}-ops
  labels: {{- include "switchyard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "switchyard.selector" . | nindent 4 }}
  ports:
    - {name: metrics, port: 9091, targetPort: metrics}
