[project]
name = "switchyard-conformance"
version = "0.1.0"
description = "Runs the official OpenAI and Anthropic SDKs against a switchyard gateway."
requires-python = ">=3.12"
dependencies = ["openai>=2", "anthropic>=1", "httpx", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
