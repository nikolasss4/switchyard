name: bench

# Load and chaos benchmarks against the mock provider, with real Postgres and
# Redis service containers. Run by hand; results are uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "short runs (harness check)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      SWITCHYARD_ADMIN_TOKEN: bench-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go build -o bin/ ./cmd/...
      - name: raise socket limits for 10k concurrent streams
        run: |
          sudo sysctl -w net.ipv4.ip_local_port_range="10000 65000"
          sudo sysctl -w net.core.somaxconn=8192
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1
      - name: run
        run: |
          ulimit -n "$(ulimit -Hn)"; ulimit -n
          ./bin/mockllm -addr 127.0.0.1:9101 -name mock-a > mock-a.log 2>&1 &
          ./bin/mockllm -addr 127.0.0.1:9102 -name mock-b > mock-b.log 2>&1 &
          ./bin/switchyard -config configs/bench.yaml > gateway.log 2>&1 &
          for i in $(seq 50); do curl -sf localhost:8080/healthz && break; sleep 0.2; done
          lscpu > bench-lscpu.txt; free -m > bench-free.txt
          ./bin/swbench ${{ inputs.quick && '-quick' || '' }} -out bench/out 2>&1 | tee bench/out-log.txt
          cp bench-lscpu.txt bench-free.txt bench/out-log.txt bench/out/
          tail -n 50 gateway.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/out
